# Publishes the website, with DocC documentation generated from the latest MaizeKit kit.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # daily, to pick up kit changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the kit
        uses: actions/checkout@v4
        with:
          repository: MaizeKit/maizekit
          path: _kit
          fetch-depth: 0 # tags, for the version shown in the docs

      - name: Copy the website
        run: rsync -a --exclude _kit --exclude _site --exclude .git --exclude .github --exclude tools --exclude MaizeKit.docc ./ _site/

      - name: Write the DocC catalog from the kit
        run: python3 tools/build_docs.py _kit

      - name: Build docs with DocC
        run: |
          docker run --rm -v "$PWD:/w" -w /w swift:6.0 \
            docc convert MaizeKit.docc --additional-symbol-graph-dir symbol-graphs \
              --fallback-display-name MaizeKit \
              --fallback-bundle-identifier io.github.maizekit \
              --transform-for-static-hosting --hosting-base-path docs \
              --output-path _site/docs
          sudo chown -R "$USER" _site
          cp tools/docs-tweaks.css _site/docs/css/maizekit.css
          find _site/docs -name index.html -exec sed -i 's#</head>#<link href="/docs/css/maizekit.css" rel="stylesheet"></head>#' {} +
          cp docs-redirect.html _site/docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
