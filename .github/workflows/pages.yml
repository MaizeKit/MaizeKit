# Builds every maze, the website and the docs, and publishes them to maizekit.github.io.
# The built site is pushed to the MaizeKit/maizekit.github.io repo, which GitHub serves at
# the bare address; this repo keeps the source. On pull requests it only builds, so a
# broken maze is caught before it's merged.
name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the release shown in the docs

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Website and docs (Starlight)
        run: |
          python3 docs/build.py
          cd docs && npm ci && npm run build

      - name: Brand files
        run: cp -R brand _site/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mazes
        # Each m/<farm>/ becomes _site/m/<farm>/: the shared app plus that farm's map.
        # build.py stops if the config is incomplete; path problems become a notice on the maze page.
        run: |
          pip install opencv-python-headless numpy
          for farm in m/*/; do
            out="_site/$farm"
            mkdir -p "$out"
            cp -R app/. "$out"
            cp "$farm"* "$out"
            (cd "$out" && python build.py)
            rm "$out/build.py" "$out/maze.config.schema.json"
          done

      - name: Old Moore Family Farm link
        # Printed signs from before the move point here; send them to the new address.
        run: |
          mkdir -p _site/moore-family-farm
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/m/moore-family-farm/"><a href="/m/moore-family-farm/">Moore Family Farm Corn Maze</a>\n' > _site/moore-family-farm/index.html

      - name: Sitemap and robots.txt
        # Starlight writes sitemap-index.xml for its pages; this one lists every maze.
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for farm in m/*/; do echo "  <url><loc>https://maizekit.github.io/$farm</loc></url>"; done
            echo '</urlset>'
          } > _site/sitemap-mazes.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://maizekit.github.io/sitemap-mazes.xml\nSitemap: https://maizekit.github.io/sitemap-index.xml\n' > _site/robots.txt

      - name: Check links
        run: python3 .github/scripts/check_links.py _site

      - name: Version stamp
        # Lets the daily live check confirm the site matches main.
        run: printf '{"commit": "%s"}\n' "${{ github.sha }}" > _site/version.json

      - name: Publish to MaizeKit/maizekit.github.io
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: MaizeKit/maizekit.github.io
          publish_branch: main
          publish_dir: ./_site
          force_orphan: true # the site repo holds only the latest build
          user_name: MaizeKit
          user_email: github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish ${{ github.sha }} from MaizeKit/MaizeKit
