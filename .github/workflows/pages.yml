# Builds every maze, the website and the docs, and publishes them to GitHub Pages.
# On pull requests it only builds, so a broken maze is caught before it's merged.
name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the release shown in the docs

      - name: Website
        run: |
          mkdir -p _site
          cp -R index.html style.css brand _site/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mazes
        # Each m/<farm>/ becomes _site/m/<farm>/: the shared app plus that farm's map.
        # build.py stops with an error if the config is incomplete or the exit can't be reached.
        run: |
          pip install opencv-python-headless numpy
          for farm in m/*/; do
            out="_site/$farm"
            mkdir -p "$out"
            cp -R app/. "$out"
            cp "$farm"* "$out"
            (cd "$out" && python build.py)
            rm "$out/build.py" "$out/maze.config.schema.json"
          done

      - name: Old Moore Family Farm link
        # Printed signs from before the move point here; send them to the new address.
        run: |
          mkdir -p _site/moore-family-farm
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/m/moore-family-farm/"><a href="/m/moore-family-farm/">Moore Family Farm Corn Maze</a>\n' > _site/moore-family-farm/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Docs
        run: |
          python3 docs/build.py
          cd docs && npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
